<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الفيزياء - تأكيد الواتساب</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- الشريط العلوي -->
    <header class="navbar">
        <div class="logo-area">
            <img src="55.jpg" alt="شعار المنصة" class="custom-logo">
            <h1 class="logo">المهندس <span>محمد صلاح</span></h1>
        </div>
        <div class="header-actions">
            <button class="theme-btn">☀️</button>
            <span class="notification-icon">🔔</span>
        </div>
    </header>

    <!-- محتوى التأكيد -->
    <main class="main-container">
        <div class="card-box" style="text-align: center;">
            <h2>تأكيد رقم الهاتف عبر واتساب</h2>
            <p>لقد أرسلنا كود التفعيل المكون من 4 أرقام إلى رقم واتساب الخاص بك. يرجى إدخاله أدناه:</p>
            
            <form id="verifyForm">
                <div class="input-group">
                    <input type="text" placeholder="----" maxlength="4" style="text-align: center; font-size: 24px; letter-spacing: 10px;" required>
                </div>
                <button type="submit" class="main-btn">تأكيد الكود والانتقال لإنشاء كلمة السر</button>
            </form>
        </div>
    </main>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الفيزياء - تسجيل الحساب</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- الشريط العلوي -->
    <header class="navbar">
        <div class="logo-area">
            <img src="55.jpg" alt="شعار المنصة" class="custom-logo">
            <h1 class="logo">المهندس <span>محمد صلاح</span></h1>
        </div>
        <div class="header-actions">
            <button class="theme-btn">☀️</button>
            <span class="notification-icon">🔔</span>
        </div>
    </header>

    <!-- محتوى التسجيل -->
    <main class="main-container">
        <div class="card-box">
            <h2>إنشاء حساب جديد</h2>
            <p>أدخل بياناتك بدقة لتتمكن من تفعيل حسابك على المنصة</p>
            
            <form id="signupForm">
                <div class="input-group">
                    <label>اسم الطالب:</label>
                    <input type="text" placeholder="أدخل اسمك الثلاثي" required>
                </div>
                <div class="input-group">
                    <label>رقم هاتف الطالب:</label>
                    <input type="tel" placeholder="01xxxxxxxxx" required>
                </div>
                <div class="input-group">
                    <label>رقم هاتف ولي الأمر:</label>
                    <input type="tel" placeholder="01xxxxxxxxx" required>
                </div>
                <div class="input-group">
                    <label>كود المنصة:</label>
                    <input type="text" placeholder="أدخل كود التفعيل" required>
                </div>
                <div class="input-group">
                    <label>العنوان / المحافظة:</label>
                    <input type="text" placeholder="أدخل المحافظة" required>
                </div>
                <button type="submit" class="main-btn">إرسال وتأكيد البيانات</button>
            </form>
        </div>
    </main>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الفيزياء - إنشاء كلمة السر</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- الشريط العلوي -->
    <header class="navbar">
        <div class="logo-area">
            <img src="55.jpg" alt="شعار المنصة" class="custom-logo">
            <h1 class="logo">المهندس <span>محمد صلاح</span></h1>
        </div>
        <div class="header-actions">
            <button class="theme-btn">☀️</button>
            <span class="notification-icon">🔔</span>
        </div>
    </header>

    <!-- محتوى إنشاء كلمة السر -->
    <main class="main-container">
        <div class="card-box">
            <h2>إعداد بيانات الدخول</h2>
            <p>أنشئ كلمة سر قوية لضمان حماية حسابك والقدرة على تسجيل الدخول لاحقاً من أي جهاز</p>
            
            <form id="passwordForm">
                <div class="input-group">
                    <label>اسم المستخدم (يتم إنشاؤه تلقائياً أو إدخاله):</label>
                    <input type="text" value="student_2026" readonly style="background-color: #e9ecef; cursor: not-allowed;">
                </div>
                <div class="input-group">
                    <label>كلمة السر:</label>
                    <input type="password" placeholder="أدخل كلمة سر جديدة" required>
                </div>
                <div class="input-group">
                    <label>تأكيد كلمة السر:</label>
                    <input type="password" placeholder="أعد إدخال كلمة السر لتأكيدها" required>
                </div>
                <button type="submit" class="main-btn">حفظ وإنهاء والدخول للمنصة</button>
            </form>
        </div>
    </main>

</body>
</html>
